<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>responsive product grid</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #ffffff;
        padding: 20px;
        
      }
      h2 {
        text-align: center;
        margin-bottom: 20px;
      }
      
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr); 
        gap: 30px;
      }

      .card {
        background: #dbdada;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        padding: 16px;
        text-align: center;
      }
      .card img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        border-radius: 6px;
        margin-bottom: 10px;
      }
      .card h3 {
        font-size: 18px;
        margin: 8px 0;
      }
      .card p {
        font-size: 14px;
        color: #555;
        margin: 4px 0;
      }
      .price {
        font-weight: bold;
        color: #007bff;
      }
      /* Responsive Breakpoints */
      @media (max-width: 1024px) {
        .grid {
          grid-template-columns: repeat(2, 1fr); 
        }
      }
      @media (max-width: 600px) {
        .grid {
          grid-template-columns: 1fr; 
        }
      }
    </style>
  </head>
  <body>
    <h2>responsive product grid</h2>
    
    <div class="grid">
      <div class="card">
        <img src="adidas tshirt.jpg" alt="tshirt" />
        <h3>plain cotton tshirt</h3>
        <p>breathable high quality tshirt.</p>
        <p class="price">₹399</p>
      </div>
      <div class="card">
        <img src="pumashoes.jpg" alt="shoes" />
        <h3>puma white sneakers</h3>
        <p>stylish white sneakers for daily use.</p>
        <p class="price">₹1799</p>
      </div>
      <div class="card">
        <img src="phone.jpg" alt="Product 3" />
        <h3>iphone 17</h3>
        <p>premium and latest iphone.</p>
        <p class="price">₹91,299</p>
      </div>
      <div class="card">
        <img src="ps5.jpg" alt="Product 4" />
        <h3>ps5</h3>
        <p>playstation 5, orignal with controller.</p>
        <p class="price">₹21,999</p>
      </div>
    </div>
  </body>
</html>
