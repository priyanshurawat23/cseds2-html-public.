<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Product Page - Simple</title>
    <link rel="stylesheet" href="experiment6.css" />
  </head>
  <body>
    <header class="header">
      <h1>PUMA STORE</h1>
    </header>
    <main class="container">
      <section class="pcard">
        <img
          class="pimage"
          src="pumashoes.jpg"
          alt="shoes"
        />
        <h2 class="ptitle">Classic Cotton T-Shirt</h2>
        <p class="pdesc">
          Soft, breathable cotton. Regular fit. Available in multiple colors.
        </p>
        <div class="price-row">
          <span class="price">₹3999</span>
          <span class="oldprice">₹5500</span>
        </div>
        <button class="buynow">buy now</button>
      </section>
    </main>
  </body>
</html>
