<!DOCTYPE html>
<html>
    <head>
        <title>flexbox</title>
        <style>
            html,*{
                padding: 0;
                margin: 0;

            }
            main{
                width: 1200px;
                /* height: 500px; */
                display: flex;
                background-color: rgb(124, 224, 91);
                margin: 0 auto;
                flex-direction: row;
                gap: 10px;
                justify-content: space-between;
                flex-wrap: wrap;
                height: auto;
                align-items: center;

            }
            .box{
                width: 280px;
                height: 350px;
                flex-grow: 1;
                height: 350px;
                background-color: rgb(190, 233, 161);
                align-items: center;
                text-align: center;


            }
            
        </style>
    </head>
    <body>
        <main>
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">1</div>
            <div class="box">2</div>
        </main>
        
        
    </body>

</html>
